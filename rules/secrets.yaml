# Hard-coded and placeholder secrets (Agent 2, no AI). CWE-798.
#
# CG-SEC-001  a value in a known secret-token format (AWS key ID, GitHub token, ...) appears
#             anywhere in the file, including comments.
# CG-SEC-002  a string constant is given to something with a secret-like name: a variable,
#             attribute, config key, dict key, keyword argument, a comparison
#             (password == "...") or an environment-variable fallback
#             (os.getenv("API_KEY", "...")).
# CG-SEC-003  the same places, but the value is a placeholder or guessable default such as
#             "your-api-key-here", "changeme" or "dev". AI tools often leave these in code;
#             they end up shipped as real, guessable credentials.
#
# Secret values are masked in the report. Sources for every rule: docs/RULE_SOURCES.md

version: 1

rules:
  - id: CG-SEC-001
    title: Hard-coded secret token
    cwe: CWE-798
    message: >-
      This text has the exact format of a real secret token. Anyone who can read the code (or
      its history) can use it.
    fix_hint: >-
      Remove the token from the code, revoke it with the provider, and read the new one from an
      environment variable or a secrets manager.
    sources:
      - https://cwe.mitre.org/data/definitions/798.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

  - id: CG-SEC-002
    title: Hard-coded credential
    cwe: CWE-798
    message: >-
      A password, key or token is written directly in the code. Everyone with access to the code
      knows it, and it cannot be changed without changing the code.
    fix_hint: >-
      Read it at run time instead, e.g. os.environ["API_KEY"], and stop with a clear error if it
      is missing. Change the exposed value.
    sources:
      - https://cwe.mitre.org/data/definitions/798.html
      - https://cwe.mitre.org/data/definitions/259.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

  - id: CG-SEC-003
    title: Placeholder or default credential
    cwe: CWE-798
    message: >-
      A placeholder or guessable default is used as a credential. If it is not replaced, the
      program runs with a secret every attacker can guess. If it is replaced in place, the real
      secret ends up in the code.
    fix_hint: >-
      Do not give secrets a default. Read them from the environment (os.environ["SECRET_KEY"])
      and stop with a clear error when they are missing.
    sources:
      - https://cwe.mitre.org/data/definitions/798.html
      - https://cwe.mitre.org/data/definitions/1392.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

# Known token formats (CG-SEC-001).
token_patterns:
  - name: AWS access key ID
    regex: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html#identifiers-unique-ids
  - name: GitHub token
    regex: '\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}\b'
    sources:
      - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github#githubs-token-formats
      - https://github.blog/engineering/platform-security/behind-githubs-new-authentication-token-formats/
  - name: GitHub fine-grained token
    regex: '\bgithub_pat_[A-Za-z0-9_]{82}\b'
    sources:
      - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github#githubs-token-formats
  - name: Slack token
    regex: '\bxox[abposr]-[0-9A-Za-z-]{10,}'
    sources:
      - https://api.slack.com/authentication/token-types
  - name: Stripe live secret key
    regex: '\b(?:sk|rk)_live_[0-9A-Za-z]{24,}\b'
    sources:
      - https://docs.stripe.com/keys
  - name: Google API key
    regex: '\bAIza[0-9A-Za-z_\-]{35}(?![0-9A-Za-z_\-])'
    sources:
      - https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
  - name: Private key (PEM)
    regex: '-----BEGIN (?:[A-Z0-9]+ )*PRIVATE KEY-----'
    sources:
      - https://www.rfc-editor.org/rfc/rfc7468#section-10
      - https://www.rfc-editor.org/rfc/rfc7468#section-11

# A name is "secret-like" when this matches it. Names are lower-cased first, camelCase is
# split with "_" (apiKey -> api_key), and other separators become "_".
secret_name_regex: '(?:^|_)(?:password|passwd|passwrd|pwd|passphrase|secret|secrets|token|access_token|auth_token|apikey|api_key|access_key|secret_key|private_key|signing_key|encryption_key|master_key|auth_key|client_secret|credential|credentials)(?:_|$)'

# ...unless the name ends with one of these parts (it names a setting about the secret, not
# the secret itself: password_field, token_url, api_key_env, secret_file, ...)
ignored_name_suffixes:
  [url, uri, endpoint, path, file, filename, dir, folder, env, var, name, field, header,
   prompt, label, type, length, len, count, regex, pattern, id, expiry, expires, ttl, timeout,
   format, algorithm, algo, min, max, size, limit, hint, help, message, msg, text, title,
   placeholder, column, col, param, policy, mode, location, kind, prefix, scheme, rule, rules,
   validator, error, errors, required, enabled]

# ...or starts with one of these parts (is_password_valid, use_token, ...). The second line
# covers language-model tokenizer settings (eos_token = "</s>", pad_token = "<pad>") and
# pagination (next_token), which are not secrets.
ignored_name_prefixes:
  [is, has, use, uses, enable, show, require, check, verify, validate, should, needs, 'no', get, set, reset, forgot,
   eos, bos, pad, unk, sep, cls, mask, special, start, end, stop, max, num, next, prev, page, cursor, continuation]

# Shortest value treated as a real hard-coded credential (CG-SEC-002).
min_length: 4

# Comparisons (x == "...") are only checked for these names. Generic names such as "token"
# are compared with strings all the time in parsers, so they would cause false alarms.
compare_name_regex: '(?:^|_)(?:password|passwd|passwrd|pwd|passphrase|secret|api_key|apikey|secret_key)(?:_|$)'

# Values that are never secrets: booleans written as text, and redaction masks.
ignored_values: ['true', 'false', 'yes', 'no', 'on', 'off', 'none', 'null']
ignored_value_regexes:
  - '^\*+$'                                       # ******** (a redaction mask)
  - '\\[wdsWDSbB]|\(\?|\[\^'                       # a regular expression (\w, (?:, [^)
  - '\[[^\]]*[A-Za-z0-9]-[A-Za-z0-9][^\]]*\]'      # a regex character class with a range ([a-zA-Z0-9])

# Placeholder values (CG-SEC-003), compared after lower-casing and trimming.
placeholder_values:
  [changeme, change-me, change_me, changeit, replaceme, replace-me, replace_me, secret,
   password, passw0rd, password1, password123, pass, pwd, test, testing, test123, dev,
   development, default, example, sample, dummy, fake, todo, tbd, admin, admin123,
   root, toor, '1234', '12345', '123456', '12345678', qwerty, letmein, secretkey, secret-key,
   secret_key, mysecret, my-secret, my_secret, mysecretkey, supersecret, super-secret,
   super_secret, apikey, api_key, api-key, token, mytoken, my-token, key, mykey]

# Placeholder patterns (CG-SEC-003), matched against the trimmed value, ignoring case.
placeholder_regexes:
  - '^<[^<>]*>$'                                    # <YOUR_API_KEY>
  - '^\[[^\[\]]*\]$'                                # [api key]
  - '^(?:x{3,}|\.{3,}|-{3,}|_{3,}|0{3,}|#{3,})$'     # xxxxxx, ...... (not ****: that is a redaction mask)
  - '^your[\s_\-]'                                  # your-api-key, YOUR_TOKEN_HERE
  - '[\s_\-]here$'                                  # api_key_here
  - '^(?:insert|enter|put|replace|add|paste|set)[\s_\-]'   # insert-key, ENTER_PASSWORD
  - 'change[\s_\-]?(?:me|this|it)'                  # please-change-me, change_this
  - '^(?:sk|pk|ghp|gsk|hf|xoxb|akia)[\s_\-]?\.{3,}$'  # sk-...
  - '^(?:dummy|fake|example|sample|placeholder|todo|tbd)(?:[\s_\-]|$)'
  - '^(?:dev|devel|development|test|testing|default|demo|local|debug|insecure)[\s_\-]?(?:secret|key|token|password|pass|pwd|api[\s_\-]?key)'
  - '^(?:super|my|very)[\s_\-]?(?:secret|password|token)'
  - '^django-insecure-'                             # Django's generated development key
